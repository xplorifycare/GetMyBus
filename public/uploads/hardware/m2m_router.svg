<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="routerMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c3440"/>
      <stop offset="100%" stop-color="#141a22"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="320" height="240" fill="#0d0d10" rx="14"/>
  <rect x="0.5" y="0.5" width="319" height="239" fill="none" stroke="rgba(255,255,255,0.06)" rx="13.5"/>

  <!-- Badge label -->
  <rect x="16" y="16" width="145" height="20" rx="6" fill="rgba(191,90,242,0.12)" stroke="rgba(191,90,242,0.3)" stroke-width="1"/>
  <text x="88" y="29" fill="#BF5AF2" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="0.5">INDUSTRIAL 4G M2M ROUTER</text>

  <!-- Dual Swivel Blade 4G Antennas -->
  <!-- Left Antenna -->
  <g transform="translate(65, 45) rotate(-20)">
    <rect x="-4" y="-70" width="8" height="70" rx="3" fill="#18181b" stroke="#333"/>
    <circle cx="0" cy="0" r="6" fill="#3f3f46" stroke="#27272a"/>
  </g>
  <!-- Right Antenna -->
  <g transform="translate(255, 45) rotate(20)">
    <rect x="-4" y="-70" width="8" height="70" rx="3" fill="#18181b" stroke="#333"/>
    <circle cx="0" cy="0" r="6" fill="#3f3f46" stroke="#27272a"/>
  </g>

  <!-- Heavy Metal Chassis (RUT240 Style) -->
  <g transform="translate(50, 75)" filter="url(#shadow)">
    <!-- Aluminum Extrusion Case with Side Mount Flanges -->
    <rect x="-10" y="35" width="240" height="40" rx="4" fill="#334155" stroke="#475569"/>
    <circle cx="-2" cy="55" r="4" fill="#0d0d10"/>
    <circle cx="222" cy="55" r="4" fill="#0d0d10"/>

    <!-- Main Router Body -->
    <rect x="10" y="0" width="200" height="110" rx="6" fill="url(#routerMetal)" stroke="#475569" stroke-width="1.2"/>

    <!-- Front Panel -->
    <rect x="20" y="10" width="180" height="90" rx="4" fill="#0f172a" stroke="#1e293b"/>

    <!-- Dual Ethernet Ports (LAN & WAN) -->
    <rect x="35" y="30" width="28" height="35" rx="2" fill="#cbd5e1" stroke="#64748b"/>
    <text x="49" y="75" fill="#94a3b8" font-family="sans-serif" font-size="6" text-anchor="middle">LAN</text>

    <rect x="75" y="30" width="28" height="35" rx="2" fill="#cbd5e1" stroke="#64748b"/>
    <text x="89" y="75" fill="#94a3b8" font-family="sans-serif" font-size="6" text-anchor="middle">WAN</text>

    <!-- Signal Bar LEDs -->
    <g transform="translate(130, 35)">
      <rect x="0" y="22" width="5" height="10" fill="#30D158"/>
      <rect x="9" y="16" width="5" height="16" fill="#30D158"/>
      <rect x="18" y="10" width="5" height="22" fill="#30D158"/>
      <rect x="27" y="4" width="5" height="28" fill="#30D158"/>
      <rect x="36" y="0" width="5" height="32" fill="#30D158"/>
      <text x="20" y="42" fill="#38bdf8" font-family="sans-serif" font-size="6" text-anchor="middle">4G SIGNAL</text>
    </g>

    <!-- Power Terminal Block (Green Industrial 4-pin) -->
    <rect x="35" y="15" width="24" height="8" rx="1" fill="#15803d" stroke="#166534"/>
    <text x="135" y="24" fill="#f8fafc" font-family="sans-serif" font-size="8" font-weight="bold">M2M INDUSTRIAL</text>
  </g>
</svg>
