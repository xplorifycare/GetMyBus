<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="buckGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="320" height="240" fill="#0d0d10" rx="14"/>
  <rect x="0.5" y="0.5" width="319" height="239" fill="none" stroke="rgba(255,255,255,0.06)" rx="13.5"/>

  <!-- Badge label -->
  <rect x="16" y="16" width="145" height="20" rx="6" fill="rgba(255,159,10,0.12)" stroke="rgba(255,159,10,0.3)" stroke-width="1"/>
  <text x="88" y="29" fill="#FF9F0A" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="0.5">24V TO 5V 3.5A DC BUCK</text>

  <!-- Industrial Waterproof Converter Module -->
  <g transform="translate(60, 60)" filter="url(#shadow)">
    <!-- Mounting Ears with Bolt Holes -->
    <rect x="0" y="30" width="200" height="60" rx="4" fill="#2d3748" stroke="#4a5568"/>
    <circle cx="12" cy="60" r="5" fill="#0d0d10"/>
    <circle cx="188" cy="60" r="5" fill="#0d0d10"/>

    <!-- Potted Waterproof Metal Case -->
    <rect x="25" y="10" width="150" height="100" rx="6" fill="url(#buckGrad)" stroke="#4b5563" stroke-width="1.2"/>

    <!-- Heat sink grooving on top -->
    <line x1="35" y1="22" x2="165" y2="22" stroke="#374151" stroke-width="1.5"/>
    <line x1="35" y1="32" x2="165" y2="32" stroke="#374151" stroke-width="1.5"/>

    <!-- Technical Specs Text on Body -->
    <text x="100" y="52" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">DC-DC STEP-DOWN</text>
    <text x="100" y="65" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="500" text-anchor="middle">IN: 12V / 24V DC (9V-35V)</text>
    <text x="100" y="78" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">OUT: 5V 3.5A (17.5W MAX)</text>

    <!-- Waterproof Epoxy Seal Indicator -->
    <rect x="35" y="90" width="130" height="10" rx="2" fill="#111" stroke="#222"/>
    <circle cx="100" cy="95" r="2" fill="#30D158"/>

    <!-- Input Wires (Left: Red & Black) -->
    <path d="M 25 40 Q -10 35 -30 25" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <path d="M 25 80 Q -10 85 -30 95" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <text x="-15" y="18" fill="#ef4444" font-family="sans-serif" font-size="8" font-weight="bold">+24V</text>
    <text x="-15" y="110" fill="#94a3b8" font-family="sans-serif" font-size="8" font-weight="bold">GND</text>

    <!-- Output Wires (Right: Dual USB-A Female Connectors) -->
    <path d="M 175 60 L 210 60" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(205, 45)">
      <rect x="0" y="0" width="30" height="30" rx="4" fill="#1e293b" stroke="#475569"/>
      <rect x="6" y="6" width="18" height="7" fill="#000" stroke="#0A84FF" stroke-width="0.8"/>
      <rect x="6" y="17" width="18" height="7" fill="#000" stroke="#0A84FF" stroke-width="0.8"/>
    </g>
  </g>
</svg>
