<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="screenDisplay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#071224"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="tvGlow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0A84FF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="320" height="240" fill="#0d0d10" rx="14"/>
  <rect x="0.5" y="0.5" width="319" height="239" fill="none" stroke="rgba(255,255,255,0.06)" rx="13.5"/>

  <!-- Badge label -->
  <rect x="16" y="16" width="125" height="20" rx="6" fill="rgba(10,132,255,0.12)" stroke="rgba(10,132,255,0.3)" stroke-width="1"/>
  <text x="78" y="29" fill="#0A84FF" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="0.5">32" HD LED TV SCREEN</text>

  <!-- 32" TV Chassis -->
  <g transform="translate(30, 48)" filter="url(#tvGlow)">
    <!-- Outer Bezel -->
    <rect x="0" y="0" width="260" height="150" rx="4" fill="#141418" stroke="#33333e" stroke-width="2"/>
    
    <!-- Active IPS Display Area -->
    <rect x="4" y="4" width="252" height="142" rx="2" fill="url(#screenDisplay)"/>

    <!-- Simulated In-Bus UI on Screen -->
    <!-- Top Route Banner -->
    <rect x="10" y="10" width="240" height="24" rx="4" fill="rgba(10,132,255,0.2)" stroke="rgba(10,132,255,0.4)" stroke-width="0.8"/>
    <text x="20" y="26" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">NEXT STOP: ALUVA METRO</text>
    <text x="240" y="26" fill="#30D158" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="end">ETA 4 MIN</text>

    <!-- Sponsor Video Box Placeholder -->
    <rect x="10" y="38" width="160" height="100" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <!-- Play Icon -->
    <circle cx="90" cy="88" r="16" fill="rgba(255,255,255,0.1)"/>
    <polygon points="86,80 98,88 86,96" fill="#ffffff"/>
    <text x="90" y="118" fill="#94a3b8" font-family="sans-serif" font-size="7" text-anchor="middle">1080p SPONSOR VIDEO AD</text>

    <!-- Right Side Live Route Ticker -->
    <rect x="175" y="38" width="75" height="100" rx="4" fill="#111827" stroke="#1f2937" stroke-width="0.8"/>
    <text x="182" y="52" fill="#93c5fd" font-family="sans-serif" font-size="7" font-weight="bold">ROUTE 12A</text>
    <circle cx="184" cy="66" r="3" fill="#30D158"/>
    <text x="192" y="69" fill="#e2e8f0" font-family="sans-serif" font-size="6.5">Kaloor</text>
    <circle cx="184" cy="82" r="3" fill="#0A84FF"/>
    <text x="192" y="85" fill="#e2e8f0" font-family="sans-serif" font-size="6.5">Edappally</text>
    <circle cx="184" cy="98" r="3" fill="#64748b"/>
    <text x="192" y="101" fill="#94a3b8" font-family="sans-serif" font-size="6.5">Kalamassery</text>
    <circle cx="184" cy="114" r="3" fill="#64748b"/>
    <text x="192" y="117" fill="#94a3b8" font-family="sans-serif" font-size="6.5">Aluva</text>

    <!-- Power Indicator LED bottom right -->
    <circle cx="250" cy="146" r="1.5" fill="#30D158"/>
  </g>

  <!-- Ceiling Mount Bracket Arms peaking from top -->
  <g transform="translate(130, 36)">
    <rect x="0" y="0" width="8" height="14" fill="#333" stroke="#222"/>
    <rect x="52" y="0" width="8" height="14" fill="#333" stroke="#222"/>
    <rect x="-10" y="-4" width="80" height="5" rx="1" fill="#444" stroke="#222"/>
  </g>
</svg>
