<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="tapeRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="320" height="240" fill="#0d0d10" rx="14"/>
  <rect x="0.5" y="0.5" width="319" height="239" fill="none" stroke="rgba(255,255,255,0.06)" rx="13.5"/>

  <!-- Badge label -->
  <rect x="16" y="16" width="145" height="20" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="88" y="29" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="0.5">3M VHB TAPE &amp; 0.5M HDMI</text>

  <!-- 3M VHB Heavy Duty Tape Roll -->
  <g transform="translate(65, 80)" filter="url(#shadow)">
    <!-- Outer Red Roll Ring -->
    <ellipse cx="60" cy="60" rx="55" ry="36" fill="url(#tapeRed)" stroke="#7f1d1d" stroke-width="1.5"/>
    <!-- Tape side thickness -->
    <path d="M 5 60 Q 60 96 115 60 L 115 72 Q 60 108 5 72 Z" fill="#b91c1c"/>
    <!-- Inner White Core Ring -->
    <ellipse cx="60" cy="58" rx="28" ry="18" fill="#ffffff" stroke="#ccc"/>
    <!-- Core Hole -->
    <ellipse cx="60" cy="58" rx="20" ry="13" fill="#0d0d10"/>
    <!-- 3M VHB Branding text on core -->
    <text x="60" y="44" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">3M</text>
    <text x="60" y="80" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">VHB™ 4910</text>
  </g>

  <!-- 0.5m Short Braided HDMI Cable -->
  <g transform="translate(180, 70)" filter="url(#shadow)">
    <!-- Curled Braided Cable -->
    <path d="M 20 40 Q 60 10 90 45 Q 110 80 70 100 Q 30 110 20 80 Q 10 50 45 40" fill="none" stroke="#27272a" stroke-width="8" stroke-linecap="round"/>
    <path d="M 20 40 Q 60 10 90 45 Q 110 80 70 100 Q 30 110 20 80 Q 10 50 45 40" fill="none" stroke="#3f3f46" stroke-width="3" stroke-linecap="round"/>

    <!-- Gold Plated HDMI Plug 1 -->
    <g transform="translate(10, 30) rotate(-40)">
      <rect x="0" y="0" width="22" height="12" rx="2" fill="#18181b" stroke="#333"/>
      <rect x="18" y="2" width="10" height="8" rx="1" fill="#eab308" stroke="#ca8a04"/>
    </g>

    <!-- Gold Plated HDMI Plug 2 -->
    <g transform="translate(50, 30) rotate(30)">
      <rect x="0" y="0" width="22" height="12" rx="2" fill="#18181b" stroke="#333"/>
      <rect x="18" y="2" width="10" height="8" rx="1" fill="#eab308" stroke="#ca8a04"/>
    </g>
    <text x="65" y="125" fill="#a1a1aa" font-family="sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">0.5m 4K Ultra-Short HDMI</text>
  </g>

  <!-- Nylon Zip Ties -->
  <g transform="translate(20, 180)">
    <line x1="10" y1="20" x2="110" y2="10" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="8" y="17" width="5" height="5" rx="1" fill="#333"/>
    <line x1="20" y1="28" x2="120" y2="18" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="18" y="25" width="5" height="5" rx="1" fill="#333"/>
    <text x="135" y="22" fill="#71717a" font-family="sans-serif" font-size="7">UV Zip Ties (Pack of 20)</text>
  </g>
</svg>
