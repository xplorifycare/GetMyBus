<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="opiPcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="320" height="240" fill="#0d0d10" rx="14"/>
  <rect x="0.5" y="0.5" width="319" height="239" fill="none" stroke="rgba(255,255,255,0.06)" rx="13.5"/>

  <!-- Badge label -->
  <rect x="16" y="16" width="145" height="20" rx="6" fill="rgba(255,159,10,0.12)" stroke="rgba(255,159,10,0.3)" stroke-width="1"/>
  <text x="88" y="29" fill="#FF9F0A" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="0.5">ORANGE PI ZERO 3 (2GB)</text>

  <!-- Orange Pi Board -->
  <g transform="translate(80, 60)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="120" rx="6" fill="url(#opiPcb)" stroke="#22c55e" stroke-width="1"/>
    
    <!-- Allwinner H618 SoC with Aluminum Black Heatsink -->
    <rect x="45" y="35" width="45" height="45" rx="3" fill="#18181b" stroke="#333" stroke-width="1"/>
    <line x1="50" y1="42" x2="85" y2="42" stroke="#555" stroke-width="1.2"/>
    <line x1="50" y1="50" x2="85" y2="50" stroke="#555" stroke-width="1.2"/>
    <line x1="50" y1="58" x2="85" y2="58" stroke="#555" stroke-width="1.2"/>
    <line x1="50" y1="66" x2="85" y2="66" stroke="#555" stroke-width="1.2"/>
    <text x="67" y="74" fill="#fb923c" font-family="sans-serif" font-size="6" font-weight="bold" text-anchor="middle">H618</text>

    <!-- RAM Chip -->
    <rect x="100" y="45" width="30" height="22" rx="2" fill="#09090b" stroke="#27272a"/>
    <text x="115" y="58" fill="#fff" font-family="monospace" font-size="5" text-anchor="middle">2GB LPDDR4</text>

    <!-- Ethernet Port (RJ45) on Right Edge -->
    <rect x="135" y="15" width="28" height="35" rx="2" fill="#cbd5e1" stroke="#64748b"/>
    <rect x="145" y="22" width="14" height="20" fill="#09090b"/>

    <!-- USB 2.0 Port -->
    <rect x="135" y="65" width="28" height="28" rx="2" fill="#94a3b8" stroke="#475569"/>

    <!-- Type-C Power Port on Left Edge -->
    <rect x="-6" y="25" width="12" height="18" rx="2" fill="#c0c0c6" stroke="#888"/>
    <text x="-15" y="38" fill="#a1a1aa" font-size="6" font-family="sans-serif">5V</text>

    <!-- Micro HDMI Port -->
    <rect x="-6" y="65" width="10" height="14" rx="1" fill="#eab308" stroke="#ca8a04"/>

    <!-- Orange Pi Logo on Board -->
    <text x="25" y="105" fill="#ea580c" font-family="sans-serif" font-size="9" font-weight="900">Orange Pi</text>
  </g>
</svg>
