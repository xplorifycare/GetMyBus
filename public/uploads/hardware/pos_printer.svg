<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="printerBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="320" height="240" fill="#0d0d10" rx="14"/>
  <rect x="0.5" y="0.5" width="319" height="239" fill="none" stroke="rgba(255,255,255,0.06)" rx="13.5"/>

  <!-- Badge label -->
  <rect x="16" y="16" width="145" height="20" rx="6" fill="rgba(10,132,255,0.12)" stroke="rgba(10,132,255,0.3)" stroke-width="1"/>
  <text x="88" y="29" fill="#0A84FF" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="0.5">58MM BLUETOOTH POS PRINTER</text>

  <!-- Portable Belt Printer -->
  <g transform="translate(90, 50)" filter="url(#shadow)">
    <!-- Main Body Housing -->
    <rect x="0" y="20" width="140" height="110" rx="12" fill="url(#printerBody)" stroke="#3f3f46" stroke-width="1.2"/>

    <!-- Paper Roll Door Cover -->
    <path d="M 15 20 Q 70 5 125 20 L 120 70 L 20 70 Z" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <rect x="55" y="15" width="30" height="6" rx="2" fill="#0A84FF"/>

    <!-- Thermal Paper Emerging from Cut Slot -->
    <g transform="translate(25, -5)">
      <path d="M 0 35 L 90 35 L 90 10 L 80 14 L 70 10 L 60 14 L 50 10 L 40 14 L 30 10 L 20 14 L 10 10 L 0 14 Z" fill="#ffffff" stroke="#e4e4e7" stroke-width="0.8"/>
      <!-- Printed lines -->
      <line x1="15" y1="18" x2="75" y2="18" stroke="#52525b" stroke-width="2"/>
      <line x1="15" y1="23" x2="60" y2="23" stroke="#71717a" stroke-width="1.2"/>
      <line x1="15" y1="28" x2="70" y2="28" stroke="#71717a" stroke-width="1.2"/>
    </g>

    <!-- Lower Control Panel -->
    <!-- Power Button -->
    <circle cx="35" cy="95" r="10" fill="#18181b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="35" y="99" fill="#ef4444" font-size="10" font-family="sans-serif" text-anchor="middle">⏻</text>

    <!-- Feed Button -->
    <circle cx="70" cy="95" r="10" fill="#18181b" stroke="#52525b" stroke-width="1.5"/>
    <text x="70" y="98" fill="#a1a1aa" font-size="7" font-family="sans-serif" text-anchor="middle">FEED</text>

    <!-- Bluetooth Status Blue LED -->
    <circle cx="105" cy="90" r="3" fill="#0A84FF"/>
    <text x="105" y="103" fill="#71717a" font-size="6" font-family="sans-serif" text-anchor="middle">BT</text>

    <!-- Power Green LED -->
    <circle cx="120" cy="90" r="3" fill="#30D158"/>
    <text x="120" y="103" fill="#71717a" font-size="6" font-family="sans-serif" text-anchor="middle">PWR</text>
  </g>
</svg>
