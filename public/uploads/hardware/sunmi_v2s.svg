<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="posBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c2c34"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>
    <filter id="posShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="320" height="240" fill="#0d0d10" rx="14"/>
  <rect x="0.5" y="0.5" width="319" height="239" fill="none" stroke="rgba(255,255,255,0.06)" rx="13.5"/>

  <!-- Badge label -->
  <rect x="16" y="16" width="135" height="20" rx="6" fill="rgba(255,159,10,0.12)" stroke="rgba(255,159,10,0.3)" stroke-width="1"/>
  <text x="83" y="29" fill="#FF9F0A" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="0.5">SUNMI V2S ANDROID POS</text>

  <!-- Sunmi Handheld Device Terminal -->
  <g transform="translate(100, 35)" filter="url(#posShadow)">
    <!-- Main Ergonomic Handheld Chassis -->
    <path d="M 15 25 Q 15 10 30 10 L 90 10 Q 105 10 105 25 L 100 170 Q 98 185 85 185 L 35 185 Q 22 185 20 170 Z" fill="url(#posBody)" stroke="#3a3a46" stroke-width="1.2"/>

    <!-- Sunmi Signature Orange Accent Collar -->
    <path d="M 22 45 L 98 45 L 96 52 L 24 52 Z" fill="#ff6b00"/>

    <!-- Top Thermal Printer Compartment Roll Head -->
    <rect x="25" y="16" width="70" height="24" rx="4" fill="#18181f" stroke="#333" stroke-width="1"/>
    <line x1="30" y1="28" x2="90" y2="28" stroke="#000" stroke-width="2"/>
    
    <!-- Printed Receipt Paper emerging from slot -->
    <g transform="translate(32, -8)">
      <path d="M 0 36 L 56 36 L 56 12 L 48 16 L 40 12 L 32 16 L 24 12 L 16 16 L 8 12 L 0 16 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
      <!-- QR code on receipt -->
      <rect x="6" y="18" width="14" height="14" fill="#000"/>
      <rect x="8" y="20" width="10" height="10" fill="#fff"/>
      <rect x="10" y="22" width="6" height="6" fill="#000"/>
      <!-- Ticket text lines -->
      <line x1="24" y1="20" x2="50" y2="20" stroke="#475569" stroke-width="1.5"/>
      <line x1="24" y1="24" x2="45" y2="24" stroke="#475569" stroke-width="1"/>
      <line x1="24" y1="28" x2="52" y2="28" stroke="#475569" stroke-width="1.2"/>
    </g>

    <!-- 5.5" Touchscreen Display -->
    <rect x="26" y="58" width="68" height="100" rx="3" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Screen Content: ETM App UI -->
    <rect x="30" y="64" width="60" height="14" rx="2" fill="#0A84FF"/>
    <text x="60" y="74" fill="#fff" font-family="sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle">ROUTE 12 - ₹15</text>

    <!-- Destination Buttons -->
    <rect x="30" y="82" width="28" height="14" rx="2" fill="#1e293b"/>
    <text x="44" y="91" fill="#e2e8f0" font-family="sans-serif" font-size="5" text-anchor="middle">ALUVA</text>
    
    <rect x="62" y="82" width="28" height="14" rx="2" fill="#1e293b"/>
    <text x="76" y="91" fill="#e2e8f0" font-family="sans-serif" font-size="5" text-anchor="middle">KALOOR</text>

    <rect x="30" y="100" width="60" height="18" rx="2" fill="#30D158"/>
    <text x="60" y="112" fill="#fff" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">PRINT TICKET</text>

    <!-- Brand Logo -->
    <text x="60" y="174" fill="#ff6b00" font-family="sans-serif" font-size="7" font-weight="900" text-anchor="middle" letter-spacing="1">SUNMI</text>
  </g>
</svg>
