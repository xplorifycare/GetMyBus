<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="invGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="320" height="240" fill="#0d0d10" rx="14"/>
  <rect x="0.5" y="0.5" width="319" height="239" fill="none" stroke="rgba(255,255,255,0.06)" rx="13.5"/>

  <!-- Badge label -->
  <rect x="16" y="16" width="145" height="20" rx="6" fill="rgba(10,132,255,0.12)" stroke="rgba(10,132,255,0.3)" stroke-width="1"/>
  <text x="88" y="29" fill="#0A84FF" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="0.5">VESA MOUNT &amp; 150W INVERTER</text>

  <!-- Left: Heavy Steel Ceiling VESA Swivel Bracket -->
  <g transform="translate(35, 55)" filter="url(#shadow)">
    <!-- Ceiling Mount Flange -->
    <rect x="15" y="5" width="70" height="12" rx="2" fill="#2d3748" stroke="#4a5568" stroke-width="1"/>
    <circle cx="25" cy="11" r="2.5" fill="#1a202c"/>
    <circle cx="75" cy="11" r="2.5" fill="#1a202c"/>

    <!-- Telescoping Steel Drop Pole -->
    <rect x="44" y="17" width="12" height="60" fill="#333" stroke="#222" stroke-width="1"/>
    
    <!-- Swivel Joint Pin -->
    <circle cx="50" cy="80" r="7" fill="#4a5568" stroke="#2d3748"/>
    <circle cx="50" cy="80" r="3" fill="#1a202c"/>

    <!-- VESA Cross Plate (100x100 / 200x200) -->
    <g transform="translate(10, 85)">
      <path d="M 10 20 L 70 20 L 70 60 L 10 60 Z" fill="#1f2937" stroke="#374151" stroke-width="1.2"/>
      <circle cx="16" cy="26" r="2" fill="#000"/>
      <circle cx="64" cy="26" r="2" fill="#000"/>
      <circle cx="16" cy="54" r="2" fill="#000"/>
      <circle cx="64" cy="54" r="2" fill="#000"/>
      <line x1="10" y1="40" x2="70" y2="40" stroke="#374151" stroke-width="1"/>
      <line x1="40" y1="20" x2="40" y2="60" stroke="#374151" stroke-width="1"/>
    </g>
    <text x="50" y="160" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Heavy Ceiling VESA</text>
  </g>

  <!-- Right: 150W DC-AC Inverter Module -->
  <g transform="translate(160, 65)" filter="url(#shadow)">
    <!-- Inverter Chassis with Aluminum Heat Sink Fins -->
    <rect x="0" y="0" width="115" height="75" rx="6" fill="url(#invGrad)" stroke="#7f1d1d" stroke-width="1.2"/>
    
    <!-- Heatsink grooves -->
    <line x1="10" y1="12" x2="105" y2="12" stroke="#7f1d1d" stroke-width="1.5"/>
    <line x1="10" y1="20" x2="105" y2="20" stroke="#7f1d1d" stroke-width="1.5"/>
    <line x1="10" y1="28" x2="105" y2="28" stroke="#7f1d1d" stroke-width="1.5"/>

    <!-- Front Faceplate (Black) -->
    <rect x="80" y="3" width="32" height="69" rx="3" fill="#18181b" stroke="#333" stroke-width="1"/>
    
    <!-- 220V AC Socket -->
    <rect x="85" y="15" width="22" height="22" rx="2" fill="#27272a"/>
    <circle cx="91" cy="23" r="1.5" fill="#000"/>
    <circle cx="101" cy="23" r="1.5" fill="#000"/>
    <circle cx="96" cy="30" r="1.8" fill="#000"/>

    <!-- Dual USB 5V Charging Ports -->
    <rect x="88" y="44" width="16" height="5" fill="#000" stroke="#0A84FF" stroke-width="0.8"/>
    <rect x="88" y="52" width="16" height="5" fill="#000" stroke="#0A84FF" stroke-width="0.8"/>

    <!-- Status Green Power LED -->
    <circle cx="88" cy="64" r="1.8" fill="#30D158"/>

    <!-- Inverter Text -->
    <text x="45" y="48" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">150W</text>
    <text x="45" y="58" fill="#fca5a5" font-family="sans-serif" font-size="6.5" text-anchor="middle">24V DC ➔ 220V AC</text>

    <!-- DC Input Cables -->
    <path d="M 0 25 Q -20 25 -30 40" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0 45 Q -20 45 -30 60" fill="none" stroke="#18181b" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
