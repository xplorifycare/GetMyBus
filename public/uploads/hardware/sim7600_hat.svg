<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="hatPcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="320" height="240" fill="#0d0d10" rx="14"/>
  <rect x="0.5" y="0.5" width="319" height="239" fill="none" stroke="rgba(255,255,255,0.06)" rx="13.5"/>

  <!-- Badge label -->
  <rect x="16" y="16" width="150" height="20" rx="6" fill="rgba(191,90,242,0.12)" stroke="rgba(191,90,242,0.3)" stroke-width="1"/>
  <text x="91" y="29" fill="#BF5AF2" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="0.5">WAVESHARE SIM7600 HAT</text>

  <!-- Blue Waveshare HAT PCB -->
  <g transform="translate(60, 55)" filter="url(#shadow)">
    <!-- Main PCB Board -->
    <rect x="0" y="0" width="200" height="130" rx="6" fill="url(#hatPcb)" stroke="#3b82f6" stroke-width="1.2"/>
    
    <!-- 4 Mounting Holes -->
    <circle cx="12" cy="12" r="3.5" fill="#facc15" stroke="#ca8a04"/>
    <circle cx="188" cy="12" r="3.5" fill="#facc15" stroke="#ca8a04"/>
    <circle cx="12" cy="118" r="3.5" fill="#facc15" stroke="#ca8a04"/>
    <circle cx="188" cy="118" r="3.5" fill="#facc15" stroke="#ca8a04"/>

    <!-- Large Shielded SIM7600 Module in Center -->
    <rect x="40" y="30" width="95" height="75" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="87" y="55" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">SIM7600EI</text>
    <text x="87" y="68" fill="#475569" font-family="sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">LTE CAT4 + GNSS</text>
    <rect x="62" y="76" width="50" height="18" fill="#000" rx="1"/>
    <text x="87" y="88" fill="#30D158" font-family="monospace" font-size="6" text-anchor="middle">SIMCom Wireless</text>

    <!-- SMA Brass Gold Antenna Connectors on Top Edge -->
    <!-- Main LTE Antenna -->
    <rect x="145" y="-10" width="14" height="12" rx="1" fill="#eab308" stroke="#a16207" stroke-width="1"/>
    <line x1="145" y1="-5" x2="159" y2="-5" stroke="#713f12" stroke-width="1"/>
    <text x="152" y="16" fill="#fef08a" font-family="sans-serif" font-size="5" text-anchor="middle">MAIN</text>

    <!-- GNSS GPS Antenna -->
    <rect x="170" y="-10" width="14" height="12" rx="1" fill="#eab308" stroke="#a16207" stroke-width="1"/>
    <line x1="170" y1="-5" x2="184" y2="-5" stroke="#713f12" stroke-width="1"/>
    <text x="177" y="16" fill="#fef08a" font-family="sans-serif" font-size="5" text-anchor="middle">GNSS</text>

    <!-- SIM Card Slot Metal Cage -->
    <rect x="145" y="45" width="45" height="50" rx="2" fill="#cbd5e1" stroke="#64748b"/>
    <rect x="150" y="50" width="35" height="20" fill="#f1f5f9"/>

    <!-- 40 Pin RPi Female Header on Left -->
    <rect x="8" y="25" width="18" height="80" rx="2" fill="#09090b" stroke="#27272a"/>
  </g>
</svg>
