<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <radialGradient id="puckGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="60%" stop-color="#161619"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
    <radialGradient id="domeGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3a3a44"/>
      <stop offset="70%" stop-color="#1c1c22"/>
      <stop offset="100%" stop-color="#0f0f13"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background plate -->
  <rect width="320" height="240" fill="#0d0d10" rx="14"/>
  <rect x="0.5" y="0.5" width="319" height="239" fill="none" stroke="rgba(255,255,255,0.06)" rx="13.5"/>

  <!-- USB Cable curving to right -->
  <path d="M 125 155 Q 110 200 170 205 Q 230 210 250 175 Q 260 155 250 130 Q 240 105 270 95" fill="none" stroke="#222228" stroke-width="6" stroke-linecap="round"/>
  <path d="M 125 155 Q 110 200 170 205 Q 230 210 250 175 Q 260 155 250 130 Q 240 105 270 95" fill="none" stroke="#383842" stroke-width="2" stroke-linecap="round"/>

  <!-- USB Plug at end -->
  <g transform="translate(265, 80) rotate(-15)">
    <rect x="0" y="0" width="36" height="18" rx="3" fill="#1e1e24" stroke="#444" stroke-width="1"/>
    <rect x="26" y="3" width="16" height="12" rx="1" fill="#bbb" stroke="#888" stroke-width="0.8"/>
    <rect x="34" y="6" width="3" height="3" fill="#333"/>
    <rect x="34" y="10" width="3" height="3" fill="#333"/>
  </g>

  <!-- GPS Puck Base Shadow -->
  <ellipse cx="120" cy="130" rx="65" ry="38" fill="rgba(0,0,0,0.6)" filter="blur(6px)"/>

  <!-- Main Puck Outer Ring -->
  <ellipse cx="120" cy="120" rx="62" ry="42" fill="url(#puckGrad)" stroke="#3a3a42" stroke-width="1.5"/>

  <!-- Raised Center Dome -->
  <ellipse cx="118" cy="115" rx="46" ry="30" fill="url(#domeGrad)" stroke="#4a4a55" stroke-width="1"/>

  <!-- Logo text -->
  <text x="118" y="112" fill="#888899" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="1.5">u-blox VK-162</text>
  <text x="118" y="123" fill="#555566" font-family="sans-serif" font-size="7" text-anchor="middle" letter-spacing="1">GPS / GLONASS</text>

  <!-- Status LED (Green GPS fix indicator) -->
  <circle cx="145" cy="114" r="3.5" fill="#30D158" filter="url(#glow)"/>
  <circle cx="145" cy="114" r="1.5" fill="#ffffff"/>

  <!-- Cable strain relief collar -->
  <path d="M 120 158 L 126 158 L 128 168 L 118 168 Z" fill="#1a1a20" stroke="#333" stroke-width="1"/>

  <!-- Badge label -->
  <rect x="16" y="16" width="105" height="20" rx="6" fill="rgba(48,209,88,0.12)" stroke="rgba(48,209,88,0.3)" stroke-width="1"/>
  <text x="68" y="29" fill="#30D158" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="0.5">USB DASHBOARD GPS</text>
</svg>
