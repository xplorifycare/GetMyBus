<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="dongleBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="100%" stop-color="#d2d2d7"/>
    </linearGradient>
    <filter id="dongleShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="greenGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="320" height="240" fill="#0d0d10" rx="14"/>
  <rect x="0.5" y="0.5" width="319" height="239" fill="none" stroke="rgba(255,255,255,0.06)" rx="13.5"/>

  <!-- Badge label -->
  <rect x="16" y="16" width="135" height="20" rx="6" fill="rgba(10,132,255,0.12)" stroke="rgba(10,132,255,0.3)" stroke-width="1"/>
  <text x="83" y="29" fill="#0A84FF" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="0.5">4G LTE USB WI-FI DONGLE</text>

  <!-- Dongle Rotated 3D Presentation -->
  <g transform="translate(60, 65)" filter="url(#dongleShadow)">
    <!-- USB Plug Connector -->
    <rect x="25" y="42" width="25" height="26" rx="2" fill="#c0c0c6" stroke="#999" stroke-width="0.8"/>
    <rect x="30" y="48" width="4" height="5" fill="#333"/>
    <rect x="30" y="57" width="4" height="5" fill="#333"/>

    <!-- Main Dongle Body -->
    <rect x="48" y="32" width="140" height="46" rx="10" fill="url(#dongleBody)" stroke="#bbb" stroke-width="1"/>
    
    <!-- Cap Seam line -->
    <line x1="62" y1="32" x2="62" y2="78" stroke="#ccc" stroke-width="1.2"/>

    <!-- 4G LTE Branding Text -->
    <text x="110" y="54" fill="#1d1d1f" font-family="sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">4G <tspan fill="#e11d48">LTE</tspan></text>
    <text x="110" y="66" fill="#6e6e73" font-family="sans-serif" font-size="8" font-weight="500">Wi-Fi Hotspot • SIM Slot</text>

    <!-- Signal LED indicators -->
    <!-- Wi-Fi Icon LED -->
    <circle cx="160" cy="55" r="3.5" fill="#30D158" filter="url(#greenGlow)"/>
    <!-- 4G Network LED -->
    <circle cx="172" cy="55" r="3.5" fill="#0A84FF"/>

    <!-- Lanyard hole -->
    <circle cx="180" cy="40" r="2.5" fill="#aaa"/>
  </g>

  <!-- Nano SIM Card Graphic -->
  <g transform="translate(195, 145) rotate(15)">
    <path d="M 0 0 L 22 0 L 28 6 L 28 35 L 0 35 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
    <rect x="4" y="6" width="18" height="22" rx="2" fill="#f59e0b"/>
    <line x1="13" y1="6" x2="13" y2="28" stroke="#b45309" stroke-width="0.8"/>
    <line x1="4" y1="16" x2="22" y2="16" stroke="#b45309" stroke-width="0.8"/>
    <text x="14" y="33" fill="#64748b" font-family="sans-serif" font-size="5" text-anchor="middle">Jio / Airtel</text>
  </g>
</svg>
